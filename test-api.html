<!DOCTYPE html>
<html>
<head>
    <title>Test API</title>
</head>
<body>
    <h1>Test Speed Test API</h1>
    <button onclick="testSave()">Test Save API</button>
    <button onclick="testOG()">Test OG Image</button>
    <div id="result"></div>
    
    <script>
        async function testSave() {
            const result = {
                downloadSpeed: 95.5,
                uploadSpeed: 45.2,
                ping: 12,
                jitter: 2,
                isp: "Test ISP",
                location: "New York",
                ipAddress: "192.168.1.1"
            };
            
            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(result)
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = `
                    <p>Save Result: ${JSON.stringify(data)}</p>
                    <p>Share Link: <a href="/share/${data.id}" target="_blank">/share/${data.id}</a></p>
                    <p>OG Image: <a href="/api/og?result=${data.id}" target="_blank">/api/og?result=${data.id}</a></p>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
        
        async function testOG() {
            const result = {
                downloadSpeed: 95.5,
                uploadSpeed: 45.2,
                ping: 12,
                jitter: 2,
                isp: "Test ISP",
                location: "New York",
                ipAddress: "192.168.1.1"
            };
            
            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(result)
                });
                
                const data = await response.json();
                window.open(`/api/og?result=${data.id}`, '_blank');
            } catch (error) {
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
